name: Build BeatVerse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          set -e
          echo "Repository:"
          pwd
          echo "Files:"
          ls -la

          test -f pubspec.yaml
          test -d lib

          echo "Flutter project detected successfully."
          flutter --version

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.beatverse \
            --project-name beatverse \
            scaffold

      - name: Copy BeatVerse source
        run: |
          rm -rf scaffold/lib
          cp -r lib scaffold/lib
          cp pubspec.yaml scaffold/pubspec.yaml

      - name: Configure Android
        run: |
          python3 << 'PY'
          import re

          # Kotlin version
          p = "scaffold/android/settings.gradle"
          text = open(p).read()

          text = re.sub(
              r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+(")',
              r'\g<1>1.9.24\2',
              text
          )

          open(p, "w").write(text)

          # minSdk
          p = "scaffold/android/app/build.gradle"
          text = open(p).read()

          text = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 21',
              text
          )

          text = re.sub(
              r'minSdkVersion\s+flutter\.minSdkVersion',
              'minSdkVersion 21',
              text
          )

          text = re.sub(
              r'minSdkVersion\s+\d+',
              'minSdkVersion 21',
              text
          )

          open(p, "w").write(text)
          PY

      - name: Enable core library desugaring
        run: |
          python3 << 'PY'
          p = "scaffold/android/app/build.gradle"
          text = open(p).read()

          # Add desugaring dependency if not already present
          if "desugar_jdk_libs" not in text:
              marker = "dependencies {"
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
                      1
                  )

          # Enable desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "compileOptions {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n        isCoreLibraryDesugaringEnabled = true",
                      1
                  )
              else:
                  text += """
          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }
          """

          open(p, "w").write(text)
          PY

      - name: Configure AndroidManifest
        run: |
          cat > scaffold/android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>

              <application
                  android:label="BeatVerse"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>

                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>

              </application>
          </manifest>
          EOF

      - name: Flutter pub get
        working-directory: scaffold
        run: flutter pub get

      - name: Build Release APK
        working-directory: scaffold
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beatverse-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
