name: BeatVerse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Find BeatVerse ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname 'BeatVerse*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "BeatVerse ZIP not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          set -e

          rm -rf beatverse_source
          mkdir beatverse_source

          unzip -q -o "$ZIP_FILE" -d beatverse_source

          PROJECT_ROOT=$(find "$GITHUB_WORKSPACE/beatverse_source" \
            -name pubspec.yaml \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_ROOT")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_ROOT"

          ls -la "$PROJECT_ROOT"

      - name: Generate Android project if missing
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then

            echo "Android folder missing."
            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --org com.beatverse \
              --project-name beatverse \
              .

          else
            echo "Android project already exists."
          fi

          test -d android
          echo "Android project ready."

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Enable desugaring
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle"

          if [ -f "$FILE" ]; then

            python3 <<'PY'
          path = "android/app/build.gradle"

          with open(path, "r") as f:
              text = f.read()

          # Enable core library desugaring
          if "coreLibraryDesugaringEnabled true" not in text:
              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
                  coreLibraryDesugaringEnabled true""",
                      1
                  )
              else:
                  text += """

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          """

          # Add desugaring dependency
          if "desugar_jdk_libs" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      """dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4""",
                      1
                  )
              else:
                  text += """

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
          }
          """

          with open(path, "w") as f:
              f.write(text)
          PY

          elif [ -f "android/app/build.gradle.kts" ]; then

            python3 <<'PY'
          path = "android/app/build.gradle.kts"

          with open(path, "r") as f:
              text = f.read()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
                  isCoreLibraryDesugaringEnabled = true""",
                      1
                  )

          if "desugar_jdk_libs" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      """dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")""",
                      1
                  )

          with open(path, "w") as f:
              f.write(text)
          PY

          else
            echo "No Android Gradle file found"
            exit 1
          fi

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build apk --release

      - name: Check APK
        run: |
          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-release
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
