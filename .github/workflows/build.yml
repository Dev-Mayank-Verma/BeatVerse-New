name: BeatVerse Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Find BeatVerse ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'BeatVerse*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BeatVerse ZIP not found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found project archive: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract BeatVerse
        shell: bash
        run: |
          set -e

          rm -rf beatverse_source
          mkdir -p beatverse_source

          unzip -q -o "$ZIP_FILE" -d beatverse_source

          echo "Extracted files:"
          find beatverse_source -maxdepth 3 -type f | sort | head -200

      - name: Locate Flutter project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/beatverse_source" \
            -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -print -quit)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: pubspec.yaml not found."
            find beatverse_source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_ROOT")"

          if [ ! -d "$PROJECT_ROOT/lib" ]; then
            echo "ERROR: lib directory not found in $PROJECT_ROOT"
            exit 1
          fi

          echo "Flutter project:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Show project structure
        shell: bash
        run: |
          echo "PROJECT_ROOT=$PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"
          echo
          echo "pubspec.yaml:"
          head -80 "$PROJECT_ROOT/pubspec.yaml"

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter clean

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Enable core library desugaring
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/android/app/build.gradle"
          APP_GRADLE_KTS="$PROJECT_ROOT/android/app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then
            python3 - "$APP_GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r") as f:
              text = f.read()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1
                  )
              else:
                  text += """

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          """

          if "desugar_jdk_libs" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
                      1
                  )
              else:
                  text += """

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
          }
          """

          with open(path, "w") as f:
              f.write(text)
          PY

          elif [ -f "$APP_GRADLE_KTS" ]; then
            python3 - "$APP_GRADLE_KTS" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r") as f:
              text = f.read()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1
                  )
              else:
                  text += """

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }
          """

          if "desugar_jdk_libs" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1
                  )
              else:
                  text += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          """

          with open(path, "w") as f:
              f.write(text)
          PY

          else
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Check Android project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter doctor -v
          echo
          echo "Android directory:"
          ls -la android
          echo
          echo "App Gradle:"
          ls -la android/app

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_ROOT/build" -type f 2>/dev/null | sort | tail -100
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-release-apk
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
