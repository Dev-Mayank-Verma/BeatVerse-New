name: BeatVerse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Find BeatVerse archive
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname 'BeatVerse*.zip' -print -quit)"
          [ -z "$ZIP_FILE" ] && { echo "::error::BeatVerse ZIP not found"; exit 1; }
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract BeatVerse
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/beatverse_source"
          mkdir -p "$GITHUB_WORKSPACE/beatverse_source"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/beatverse_source"

      - name: Locate Flutter project
        shell: bash
        run: |
          set -e
          PUBSPEC="$(find "$GITHUB_WORKSPACE/beatverse_source" -type f -name pubspec.yaml -print -quit)"
          [ -z "$PUBSPEC" ] && { echo "::error::pubspec.yaml not found"; exit 1; }
          PROJECT_ROOT="$(dirname "$PUBSPEC")"
          [ ! -d "$PROJECT_ROOT/lib" ] && { echo "::error::Flutter lib directory missing"; exit 1; }
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "================================"
          echo "PROJECT: $PROJECT_ROOT"
          echo "================================"

      - name: Generate Android platform
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          if [ ! -f android/app/build.gradle ]; then
            rm -rf android
            flutter create --platforms=android --org com.beatverse --project-name beatverse .
          fi
          test -f android/settings.gradle
          test -f android/app/build.gradle
          echo "Android platform ready."

      - name: Force compatible Android toolchain
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set"
                  return flutterSdkPath
              }()

              includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.4.1" apply false
              id "org.jetbrains.kotlin.android" version "1.9.21" apply false
          }

          include ":app"
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.4.1" apply false
              id "org.jetbrains.kotlin.android" version "1.9.21" apply false
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          android.enableR8=true
          android.enableR8.fullMode=false
          EOF

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Configure Android app
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          path = "android/app/build.gradle"

          text = open(path).read()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 21"
          )

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 21"
          )

          # Remove old kotlinOptions blocks.
          lines = text.splitlines()
          cleaned = []

          skip = False
          depth = 0

          for line in lines:
              if "kotlinOptions {" in line:
                  skip = True
                  depth = line.count("{") - line.count("}")
                  continue

              if skip:
                  depth += line.count("{") - line.count("}")
                  if depth <= 0:
                      skip = False
                  continue

              cleaned.append(line)

          text = "\n".join(cleaned) + "\n"

          # Add kotlinOptions for Java 17
          if "kotlinOptions {" not in text:
              text = text.replace(
                  "android {",
                  """android {
               kotlinOptions {
                   jvmTarget = '17'
               }""",
                  1
              )

          # Enable core library desugaring.
          if "coreLibraryDesugaringEnabled true" not in text:
              if "compileOptions {" in text:
                  text = text.replace(
                      "compileOptions {",
                      """compileOptions {
                   coreLibraryDesugaringEnabled true""",
                      1
                  )
              else:
                  text += """
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          """

          # Add desugaring dependency.
          if "coreLibraryDesugaring " not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      """dependencies {
                 coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4""",
                      1
                  )
              else:
                  text += """
          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          """

          # Add R8 keep rules for Android API 34 compatibility
          if "buildTypes {" not in text:
              text += """
          buildTypes {
              release {
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }
          }
          """

          open(path, "w").write(text)
          PY

      - name: Create ProGuard rules for R8
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          mkdir -p android/app

          cat > android/app/proguard-rules.pro <<'EOF'
          # Keep native methods
          -keepclasseswithmembernames class * {
              native <methods>;
          }

          # Dontwarn missing Android API 34 classes
          -dontwarn android.window.BackEvent
          -dontwarn android.window.**
          -dontwarn android.graphics.Path$**
          -dontwarn android.graphics.Matrix**

          # Keep Flutter core classes
          -keep class io.flutter.** { *; }
          -dontwarn io.flutter.**
          -keep class io.flutter.view.** { *; }
          -keep class io.flutter.embedding.** { *; }

          # Keep WebView
          -keep class android.webkit.** { *; }
          -dontwarn android.webkit.**

          # Keep flutter_inappwebview plugin
          -keep class com.pichillilorenzo.flutter_inappwebview.** { *; }
          -dontwarn com.pichillilorenzo.flutter_inappwebview.**
          -keep class com.pichillilorenzo.** { *; }
          -dontwarn com.pichillilorenzo.**

          # Keep generic Android classes
          -keep class android.content.** { *; }
          -keep class android.app.** { *; }
          -keep class android.os.** { *; }
          -keep class android.view.** { *; }

          # Keep Serializable classes
          -keepclassmembers class * implements java.io.Serializable {
              static final long serialVersionUID;
              private static final java.io.ObjectStreamField[] serialPersistentFields;
              private void writeObject(java.io.ObjectOutputStream);
              private void readObject(java.io.ObjectInputStream);
              java.lang.Object writeReplace();
              java.lang.Object readResolve();
          }

          # Keep Parcelable classes
          -keep class * implements android.os.Parcelable {
              public static final android.os.Parcelable$Creator *;
          }

          # General attributes
          -keepattributes *Annotation*
          -keepattributes Signature
          -keepattributes SourceFile,LineNumberTable
          -keepattributes Exceptions
          -keepattributes InnerClasses
          -keepattributes Synthetic
          -keepattributes EnclosingMethod

          # Ignore all warnings
          -ignorewarnings

          # Remove verbose logging
          -assumenosideeffects class android.util.Log {
              public static *** d(...);
              public static *** v(...);
              public static *** i(...);
              public static *** w(...);
          }

          # Kotlin specific
          -keepclassmembers class **$WhenMappings {
              <fields>;
          }
          -keep class kotlin.Metadata { *; }
          -dontwarn kotlin.**

          # Gson
          -keep class com.google.gson.** { *; }
          -dontwarn com.google.gson.**

          # Retrofit
          -keep class retrofit.** { *; }
          -dontwarn retrofit.**

          # OkHttp
          -keep class okhttp.** { *; }
          -keep class okhttp3.** { *; }
          -dontwarn okhttp.**
          -dontwarn okhttp3.**

          # AndroidX
          -keep class androidx.** { *; }
          -dontwarn androidx.**

          # Google Play Services
          -keep class com.google.** { *; }
          -dontwarn com.google.**

          # Range rules
          -dontwarn com.google.common.**
          -dontwarn java.lang.invoke.**
          -dontwarn sun.misc.**
          EOF

          echo "ProGuard rules created successfully"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          flutter pub get

      - name: Fix legacy Android plugin namespaces
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Searching Flutter plugins for missing namespaces..."

          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          python3 <<'PY'
          import os
          import re
          import glob

          pub_cache = os.environ.get(
              "PUB_CACHE",
              os.path.expanduser("~/.pub-cache")
          )

          roots = [
              os.path.join(pub_cache, "hosted"),
              os.path.join(pub_cache, "git"),
          ]

          fixed = []

          for root in roots:
              if not os.path.isdir(root):
                  continue

              for build_file in glob.glob(
                  os.path.join(root, "**", "android", "build.gradle"),
                  recursive=True
              ):
                  try:
                      text = open(
                          build_file,
                          "r",
                          encoding="utf-8"
                      ).read()
                  except Exception:
                      continue

                  if "com.android.library" not in text:
                      continue

                  if re.search(
                      r'^\s*namespace\s+[\'"]',
                      text,
                      re.MULTILINE
                  ):
                      continue

                  manifest_candidates = [
                      os.path.join(
                          os.path.dirname(build_file),
                          "src",
                          "main",
                          "AndroidManifest.xml"
                      ),
                      os.path.join(
                          os.path.dirname(build_file),
                          "src",
                          "main",
                          "AndroidManifest.xml"
                      ),
                  ]

                  package_name = None

                  for manifest in manifest_candidates:
                      if not os.path.isfile(manifest):
                          continue

                      try:
                          manifest_text = open(
                              manifest,
                              "r",
                              encoding="utf-8"
                          ).read()
                      except Exception:
                          continue

                      match = re.search(
                          r'<manifest[^>]*\bpackage\s*=\s*["\']([^"\']+)["\']',
                          manifest_text
                      )

                      if match:
                          package_name = match.group(1)
                          break

                  if not package_name:
                      continue

                  lines = text.splitlines()

                  insert_at = None

                  for i, line in enumerate(lines):
                      if "android {" in line:
                          insert_at = i + 1
                          break

                  if insert_at is None:
                      continue

                  lines.insert(
                      insert_at,
                      f'    namespace "{package_name}"'
                  )

                  new_text = "\n".join(lines) + "\n"

                  try:
                      open(
                          build_file,
                          "w",
                          encoding="utf-8"
                      ).write(new_text)

                      fixed.append(
                          (build_file, package_name)
                      )
                  except Exception:
                      pass

          print("==========================================")
          print("Legacy namespace compatibility scan")
          print("==========================================")

          if fixed:
              for path, namespace in fixed:
                  print(
                      f"FIXED: {path}"
                      f" -> namespace {namespace}"
                  )
          else:
              print("No missing plugin namespaces detected.")

          print(f"Total fixed: {len(fixed)}")
          PY

      - name: Force known flutter_inappwebview namespace
        shell: bash
        run: |
          set -e

          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          FOUND=0

          while IFS= read -r FILE; do
            if grep -q "com.android.library" "$FILE" 2>/dev/null; then

              if ! grep -qE '^[[:space:]]*namespace[[:space:]]+' "$FILE"; then

                echo "Adding namespace to:"
                echo "$FILE"

                python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          if "namespace " not in text:
              text = text.replace(
                  "android {",
                  'android {\n    namespace "com.pichillilorenzo.flutter_inappwebview"',
                  1
              )

              open(
                  path,
                  "w",
                  encoding="utf-8"
              ).write(text)
          PY

                FOUND=1
              fi
            fi
          done < <(
            find "$PUB_CACHE" \
              -type f \
              -path "*/flutter_inappwebview-*/android/build.gradle" \
              2>/dev/null
          )

          if [ "$FOUND" = "1" ]; then
            echo "flutter_inappwebview namespace compatibility fix applied."
          else
            echo "flutter_inappwebview namespace already present or plugin path not found."
          fi

      - name: Clear Gradle caches
        shell: bash
        run: |
          set -e

          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf ~/.gradle/native
          rm -rf ~/.gradle/wrapper

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean

      - name: Verify Gradle versions
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          ./android/gradlew --version

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK not generated"

            find "$PROJECT_ROOT/build" \
              -type f \
              2>/dev/null | sort | tail -100

            exit 1
          fi

          echo "======================================"
          echo "       BEATVERSE BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-release-apk
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
